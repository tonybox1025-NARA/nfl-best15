# 무료 자동 실행 (GitHub Actions)
# - 정해진 시간에 자동 실행
# - 앱의 "최신 업데이트" 버튼 → workflow_dispatch(refresh=true) 호출 → 1~2분 뒤 결과 갱신
name: best15

on:
  schedule:
    - cron: "0 14 * * 3,4,5"        # 수·목·금 09:00 ET (훈련 참여 리포트)
    - cron: "0 22 * * 1,4,5,6"      # 월·목·금·토 17:00 ET (금요일 최종 부상 리포트, MNF/TNF 전)
    - cron: "0 15-23 * * 0"         # 일요일 10:00~18:00 ET 매시간 (비출전 명단 포함)
    - cron: "0 14 * * 2"            # 화 09:00 ET (월요일 경기까지 채점)
  workflow_dispatch:
    inputs:
      refresh:
        description: "부상·날씨·배당만 새로 받기"
        type: boolean
        default: true

permissions:
  contents: write

# 버튼을 여러 번 눌러도 한 번에 하나씩만 실행
concurrency:
  group: best15
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-
      - name: 베스트 15 계산
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run_week.py ${{ inputs.refresh && '--refresh' || '' }}
          python make_report.py
          python grade.py
      - name: 결과 저장
        run: |
          git config user.name "best15-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git commit -m "best15 $(date -u +%FT%TZ)" || echo "변경 없음"
          git pull --rebase origin main
          git push
