<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="베스트15">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>NFL 베스트 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --s1:#141D2E; --s2:#1C2740; --line:#26324A; --line2:#1F2A40;
  --tx:#F2F5FA; --mu:#9AA8BF; --mu2:#C9D3E3; --acc:#FF8A3D; --acc2:#FFC59E; --acc-ink:#1A0E05;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --num:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.sub{font-size:13px;color:var(--mu);font-weight:500}
h1{margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.5px}
h2{margin:0;font-size:19px;font-weight:900}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--mu)} .small{font-size:12px} .num{font-family:var(--num)}
.btn-main{height:52px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-main:disabled{opacity:.7}
.btn-line{height:44px;border:1px solid var(--acc);border-radius:12px;background:transparent;color:var(--acc);font-size:14px;font-weight:700;padding:0 14px}
.btn-ghost{height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--mu2);font-size:14px;padding:0 14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;color:var(--mu);font-size:14px;font-weight:700}
.seg button.on{background:var(--tx);color:var(--bg)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini>div{background:var(--s2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{display:flex;gap:12px;padding:13px;background:var(--s1);border:1px solid var(--line);border-radius:14px;align-items:center;color:var(--tx);text-decoration:none;cursor:pointer}
.rank{width:28px;text-align:center;font-family:var(--num);font-weight:700;font-size:20px;color:var(--mu);flex:none}
.rank.top{color:var(--acc);font-size:23px}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plabel{font-size:14px;font-weight:500;color:var(--acc2)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:6px;background:var(--acc);border-radius:3px}
.pside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:66px}
.pprob{font-family:var(--num);font-size:23px;font-weight:700}
.edge-p{font-size:12px;font-weight:700;color:var(--ok)} .edge-n{font-size:12px;font-weight:700;color:var(--mu)}
.badge{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap;flex:none}
.b-ok{color:var(--ok);border:1px solid var(--ok)}
.b-q{color:#0B1220;background:var(--warn)}
.b-out{color:#fff;background:#C2410C}
.b-soft{color:var(--warn);border:1px solid var(--warn)}
.star{width:44px;height:44px;border:0;background:transparent;color:var(--mu);display:flex;align-items:center;justify-content:center;flex:none;margin:-8px -6px -8px -4px}
.star.on{color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0F1828;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs a{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu);text-decoration:none;font-size:11px;position:relative;white-space:nowrap}
.tabs a.on{color:var(--acc);font-weight:700}
.cnt{position:absolute;top:8px;left:calc(50% + 6px);background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:900;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
.game{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.team{font-family:var(--num);font-size:22px;font-weight:700}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;color:var(--mu);font-size:14px;background:none;border:0;padding:0}
.changes div{font-size:13px;padding:2px 0}
.chart{position:relative;height:150px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;border-bottom:1px solid var(--line)}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.chart .col i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--acc)}
.chart .col i.miss{background:#5B6B86}
.chart .need{position:absolute;left:0;right:0;border-top:2px dashed var(--mu)}
.reason{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.reason .ic{width:22px;flex:none;text-align:center;font-weight:900}
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.75);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.on{display:flex}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
input[type=password],input[type=text]{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:0 12px;font-size:15px}
label{font-size:13px;color:var(--mu2)}
ol{margin:0;padding-left:20px;font-size:13px;color:var(--mu2);line-height:1.7}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:30px 0}
.res{font-size:11px;font-weight:900;border-radius:6px;padding:2px 7px;white-space:nowrap}
.r-hit{background:#14532D;color:var(--ok)} .r-miss{background:#3B1D1D;color:var(--bad)} .r-void{background:var(--s2);color:var(--mu)} .r-pending{background:var(--s2);color:var(--mu2)}
.cal{display:flex;flex-direction:column;gap:4px}
.cal .b{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}.cal .b i{display:block;height:8px}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);text-align:center;bottom:96px;background:var(--tx);color:var(--bg);font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>

// 엔진이 만든 한국어 문구 → 영어
function trLabel(s) {
  if (LANG === "ko" || !s) return s;
  const n = x => (String(x).includes(".") ? "Over " + x : x + "+");
  return s
    .replace(/^애니타임 터치다운$/, "Anytime TD")
    .replace(/^패싱 TD ([\d.]+)개 이상$/, (_, x) => `${n(x)} Pass TDs`)
    .replace(/^패싱 ([\d.]+)야드 이상$/, (_, x) => `${n(x)} Pass Yds`)
    .replace(/^러싱 ([\d.]+)야드 이상$/, (_, x) => `${n(x)} Rush Yds`)
    .replace(/^리시빙 ([\d.]+)야드 이상$/, (_, x) => `${n(x)} Rec Yds`)
    .replace(/^리셉션 ([\d.]+)개 이상$/, (_, x) => `${n(x)} Receptions`);
}
function trChange(c) {
  if (LANG === "ko") return c;
  let m;
  if ((m = /^▲ (.+?) ((?:애니타임|패싱|러싱|리시빙|리셉션).+?) 새로 진입 \((\d+)위, ([\d.]+)%\)$/.exec(c))) return `▲ ${m[1]} ${trLabel(m[2])} entered (#${m[3]}, ${m[4]}%)`;
  if ((m = /^• (.+?) ((?:애니타임|패싱|러싱|리시빙|리셉션).+?) ([\d.]+)% → ([\d.]+)%$/.exec(c))) return `• ${m[1]} ${trLabel(m[2])} ${m[3]}% → ${m[4]}%`;
  if ((m = /^▼ (.+?) ((?:애니타임|패싱|러싱|리시빙|리셉션).+?) 베스트 15에서 빠짐$/.exec(c))) return `▼ ${m[1]} ${trLabel(m[2])} dropped out`;
  if ((m = /^✕ (.+) 결장 반영$/.exec(c))) return `✕ ${m[1]} ruled out`;
  return c;
}
function trEffect(s) {

// ================================================================== data
function token() { return store.get("gh_token", ""); }
function gh(path, opt = {}) {
  const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.headers || {}) };
  if (token()) h.Authorization = "Bearer " + token();
  return fetch(API + path, { ...opt, headers: h, cache: "no-store" });
}
// 예전 결과 파일에 NaN/Infinity가 섞여 있어도 읽을 수 있게 null로 바꿔요
function parseJSON(t) { return JSON.parse(t.replace(/:\s*-?(NaN|Infinity)\b/g, ": null")); }
async function loadData(fresh) {
  try {
    if (fresh && token()) {
      const r = await gh("/contents/output/latest.json?ref=main", { headers: { Accept: "application/vnd.github.raw+json" } });
      if (r.ok) { D = parseJSON(await r.text()); return; }
    }
    const r = await fetch("output/latest.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = parseJSON(await r.text());
  } catch (e) {
    $("#app").innerHTML = `<div class="card">${esc(L().load_err(e.message))}</div>`;
    throw e;
  }
}
let R = null, Rerr = null;  // record.json
async function loadRecord(fresh) {
  try {
    if (fresh && token()) {
      const r = await gh("/contents/output/record.json?ref=main", { headers: { Accept: "application/vnd.github.raw+json" } });
      if (r.ok) { R = parseJSON(await r.text()); return; }
    }
    const r = await fetch("output/record.json?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404) { R = { empty: true }; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    R = parseJSON(await r.text());
  } catch (e) { Rerr = e.message; }
}

function kick(s) {             // "2026-11-15 13:00 ET" → "일 11/15 1:00 PM"
  const m = /(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(s || ""); if (!m) return s || "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]); let h = +m[4]; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${L().dow[d.getDay()]} ${+m[2]}/${+m[3]} ${h}:${m[5]} ${ap}`;
}
function gameOf(gid) { return D.games.find(g => g.game_id === gid); }

function short(s) {
  s = s || ""; const ko = LANG === "ko"; let m;
  if ((m = /ESPN 실시간 (\d+)/.exec(s))) return ko ? `ESPN ${m[1]}건` : `ESPN ${m[1]}`;
  if (s.includes("NFL 공식 리포트")) return ko ? "NFL" : "NFL";
  if (s.startsWith("FanDuel")) { m = /배당 (\d+)개/.exec(s); return ko ? `${m && m[1]}개 새로` : `${m && m[1]} new`; }
  if ((m = /배당 (\d+)분 전/.exec(s))) return ko ? `${m[1]}분 전` : `${m[1]} min ago`;
  if (s.includes("이전 배당")) return ko ? "이전 배당" : "Previous";
  if (s.startsWith("날씨 실패")) return ko ? "실패" : "Failed";
  if ((m = /날씨 (\d+)경기/.exec(s))) return ko ? `${m[1]}경기` : `${m[1]} games`;
  if (s.includes("야외 경기 없음")) return ko ? "야외 없음" : "All dome";
  if (s.includes("미사용")) return ko ? "미사용" : "Off";
  return s.split(" ")[0] || "-";
}

  const dec = withOdds.reduce((a, p) => a * (p.odds > 0 ? 1 + p.odds / 100 : 1 + 100 / -p.odds), 1);
  const am = !withOdds.length ? "-" : dec >= 2 ? "+" + Math.round((dec - 1) * 100) : "−" + Math.round(100 / (dec - 1));
  const byGame = {}; tk.forEach(p => byGame[p.game_id] = (byGame[p.game_id] || 0) + 1);
  const sameGame = Object.values(byGame).some(n => n > 1);
  return `<header class="between"><div><div class="sub">${sw()}</div><h1>${t.title_ticket}</h1></div><button class="btn-ghost" id="clear-t">${t.clear}</button></header>

// ================================================================== refresh (GitHub Actions)
function refreshText() {
  const s = Math.round((Date.now() - refreshing.start) / 1000);
  return L().elapsed(refreshing.status(), Math.floor(s / 60), String(s % 60).padStart(2, "0"));
}
async function doRefresh() {
  if (refreshing) return;
  const t0 = L();
  if (!token()) { openSettings(t0.need_token); return; }
  refreshing = { start: Date.now(), status: () => L().rq }; render();
  try {
    const r = await gh(`/actions/workflows/${WF}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main", inputs: { refresh: "true" } }) });
    if (r.status === 401 || r.status === 403) throw new Error(L().r_auth);
    if (!r.ok) throw new Error(L().r_fail(r.status));
    const since = refreshing.start - 15000;
    let runId = null;
    for (;;) {
      await new Promise(res => setTimeout(res, 8000));
      const rr = await gh(`/actions/workflows/${WF}/runs?per_page=5&event=workflow_dispatch`);
      const js = await rr.json();
      const run = (js.workflow_runs || []).find(x => runId ? x.id === runId : new Date(x.created_at).getTime() >= since);
      if (run) {
        runId = run.id;
        refreshing.status = run.status === "queued" ? () => L().r_queued : run.status === "in_progress" ? () => L().r_prog : () => L().r_fin;
        if (run.status === "completed") {
          if (run.conclusion !== "success") throw new Error(L().r_cfail);
          refreshing.status = () => L().r_load; render();
          await new Promise(res => setTimeout(res, 3000));
          await loadData(true); R = null;
          refreshing = null; render(); toast(L().r_done);
          return;
        }
      }
      if (Date.now() - refreshing.start > 12 * 60000) throw new Error(L().r_slow);
      render();
    }
  } catch (e) {
    refreshing = null; render(); toast(e.message);
  }
}
setInterval(() => { if (refreshing) { const el = document.querySelector("#refresh + div"); if (el) el.textContent = refreshText(); } }, 1000);

  if (e.target === $("#settings") || e.target.closest("#st-close")) { $("#settings").classList.remove("on"); return; }
  if (e.target.closest("#st-del")) { store.del("gh_token"); $("#tok").value = ""; $("#st-msg").textContent = t.tok_del; return; }
  if (e.target.closest("#st-save")) {
    const v = $("#tok").value.trim(); if (!v) return;
    store.set("gh_token", v); $("#st-msg").textContent = t.checking;
    const r = await gh(`/actions/workflows/${WF}`);
    $("#st-msg").textContent = r.ok ? t.tok_ok : t.tok_bad(r.status);
    if (r.ok) setTimeout(() => $("#settings").classList.remove("on"), 900);
  }
});

function setLang(l) {
  LANG = l === "en" ? "en" : "ko"; store.set("lang", LANG);
  document.documentElement.lang = LANG; document.title = LANG === "ko" ? "NFL 베스트 15" : "NFL Best 15";
  renderTabs(); render();
  if ($("#settings").classList.contains("on")) { const tok = $("#tok").value; $("#st-sheet").innerHTML = settingsHTML(); $("#tok").value = tok; }
}

// ================================================================== router
function renderTabs() {
  const t = L();
  const a = (id, ic, name, extra = "") => `<a href="#${id}" data-tab="${id}">${ic}${name}${extra}</a>`;
  $("#tabs").setAttribute("aria-label", t.menu);
  $("#tabs").innerHTML = a("home", I.list, t.tab_home) + a("games", I.cal, t.tab_games) +
    a("ticket", I.ticket, t.tab_ticket, '<span class="cnt" id="tcnt" hidden></span>') + a("record", I.chart, t.tab_record) + a("check", I.warn, t.tab_check);
}
let lastPick = null;
function render() {
  if (!D) return;
  PICKS = {};
  const h = location.hash || "#home";
  let html, tab = "home";
  if (h.startsWith("#game-")) { html = vGame(h.slice(6)); tab = "games"; }
  else if (h === "#games") { html = vGames(); tab = "games"; }
  else if (h === "#ticket") { html = vTicket(); tab = "ticket"; }
  else if (h === "#check") { html = vCheck(); tab = "check"; }
  else if (h === "#record") { html = vRecord(); tab = "record"; }
  else if (h.startsWith("#pick-") && lastPick) { html = vPick(); tab = lastPick.tab; }
  else html = vHome();
  $("#app").innerHTML = html;
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  updCount();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-lang],[data-star],[data-pick],[data-game],[data-sort],[data-gsort],[data-go],#refresh,#refresh2,#open-st,#clear-t");
  if (!t) return;
  if (t.dataset.lang) { setLang(t.dataset.lang); return; }
  if (t.dataset.star) { e.stopPropagation(); toggleTicket(PICKS[t.dataset.star]); const y = scrollY; render(); scrollTo(0, y); return; }
  if (t.dataset.pick) {
    const p = PICKS[t.dataset.pick]; const tab = document.querySelector(".tabs a.on")?.dataset.tab || "home";
    lastPick = { tab, p }; location.hash = "#pick-" + Date.now().toString(36); return;
  }
  if (t.dataset.game) { location.hash = "#game-" + t.dataset.game; return; }
  if (t.dataset.sort) { view.sort = t.dataset.sort; store.set("sort", view.sort); render(); return; }
  if (t.dataset.gsort) { view.gsort = t.dataset.gsort; const y = scrollY; render(); scrollTo(0, y); return; }
  if (t.dataset.go) { if (t.dataset.go === "back") history.back(); else location.hash = t.dataset.go; return; }
  if (t.id === "refresh" || t.id === "refresh2") { doRefresh(); return; }
  if (t.id === "open-st") { openSettings(); return; }
  if (t.id === "clear-t") { setTicket([]); render(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-pick],[data-game]")) e.target.click(); });
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

(async () => {
  document.documentElement.lang = LANG; document.title = LANG === "ko" ? "NFL 베스트 15" : "NFL Best 15";
  renderTabs();
  $("#app").innerHTML = `<div class="empty">${L().loading}</div>`;
  await loadData(!!token());
  if ((location.hash || "").startsWith("#pick-")) location.hash = "#home";
  render();
})();
</script>
</body>
